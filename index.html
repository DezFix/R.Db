<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Новая вкладка</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="boot">
<div id="bgA" class="bg"></div>
<div id="bgB" class="bg" hidden></div>
<div id="dim"></div>

<main class="center">
  <div class="clock-block" id="clockBlock">
    <div id="clock">00:00</div>
    <div id="date"></div>
  </div>

  <div id="grid" class="board"></div>
  <p id="empty" class="empty" hidden>Пусто — включи ✎ и добавь первую ссылку</p>

  <div id="editBar" class="editbar" hidden>
    <button id="addBtn">+ Добавить</button>
  </div>
</main>

<!-- Папка поверх рабочего стола -->
<div id="folderView" class="overlay folder-overlay" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <div class="sheet-titles">
        <h3 id="folderTitle"></h3>
        <span id="folderCount"></span>
      </div>
      <button id="folderAddBtn" title="Добавить закладку">+</button>
    </div>
    <nav id="folderCrumbs" class="crumbs"></nav>
    <div id="folderGrid" class="grid sheet-grid"></div>
    <p id="folderEmpty" class="empty" hidden>Пусто — нажми + сверху, чтобы добавить</p>
  </div>
</div>

<footer class="dock">
  <span id="credit" class="credit"></span>
  <div class="spacer"></div>
  <button id="nextBgBtn" title="Следующий фон">⤾</button>
  <button id="editToggle" title="Редактировать">✎</button>
  <button id="settingsBtn" title="Настройки">⚙</button>
</footer>

<!-- Модалка виджета -->
<div id="wmodal" class="overlay" hidden>
  <form id="wmodalForm" class="card-modal">
    <h3 id="wmodalTitle">Новый виджет</h3>
    <label id="wTypeWrap">Тип
      <select id="wType">
        <option value="link">Ссылка</option>
        <option value="folder">Папка</option>
        <option value="note">Заметка</option>
        <option value="checklist">Чек-лист</option>
        <option value="weather">Погода</option>
        <option value="currency">Курсы валют</option>
        <option value="crypto">Крипта</option>
        <option value="quote">Цитата дня</option>
      </select>
    </label>
    <label id="wTitleWrap">Название<input id="wTitle" maxlength="60" placeholder="Название"></label>
    <label id="wUrlWrap">URL<input id="wUrl" type="text" inputmode="url" placeholder="https://..."></label>
    <label id="wCityWrap">Город<input id="wCity" type="text" placeholder="Москва"></label>
    <label id="wCurWrap" class="check"><input type="checkbox" id="wCur"> Текущая погода</label>
    <label id="wDaysWrap">Дней (0–7)<input id="wDays" type="number" min="0" max="7" step="1" value="3"></label>
    <label id="wHoursWrap">Часов (0–24, шаг 3)<input id="wHours" type="number" min="0" max="24" step="3" value="0"></label>
    <label id="wBaseWrap">Базовая валюта
      <select id="wBase">
        <option>USD</option><option>EUR</option><option selected>UAH</option><option>GBP</option>
        <option>PLN</option><option>CHF</option><option>JPY</option><option>CNY</option>
        <option>CZK</option><option>SEK</option><option>CAD</option><option>AUD</option>
      </select>
    </label>
    <label id="wSymsWrap">Валюты
      <select id="wSyms" multiple size="6">
        <option selected>USD</option><option selected>EUR</option><option>UAH</option><option>GBP</option>
        <option>PLN</option><option>CHF</option><option>JPY</option><option>CNY</option>
        <option>CZK</option><option>SEK</option><option>CAD</option><option>AUD</option>
      </select>
    </label>
    <label id="wCoinsWrap">Монеты через запятую<input id="wCoins" type="text" placeholder="BTC, ETH, SOL"></label>
    <div class="row">
      <button type="submit" class="btn-primary">Сохранить</button>
      <button type="button" id="wmodalCancel" class="btn-ghost">Отмена</button>
    </div>
  </form>
</div>

<!-- Настройки: боковая панель как в Bonjourr -->
<div id="settingsModal" class="drawer-root" hidden>
  <div class="drawer-bg" id="settingsBg"></div>
  <aside class="drawer">
    <div class="drawer-head">
      <h3>Настройки</h3>
      <button id="settingsClose" type="button" title="Закрыть">✕</button>
    </div>
    <div class="drawer-body">
      <div class="set-box">
      <h4>🖼 Фон</h4>
      <label>Источник
        <select id="sBgMode">
          <option value="curated">Карусель (подборка)</option>
          <option value="custom">Свои картинки (ссылки)</option>
          <option value="upload">Своя картинка (файл)</option>
          <option value="gradient">Градиент</option>
          <option value="color">Цвет</option>
        </select>
      </label>

      <div id="bgCuratedBox">
        <div class="row">
          <button type="button" id="bgNextBtn" class="btn-ghost">Следующий фон</button>
          <button type="button" id="bgShuffleBtn" class="btn-ghost">Случайный</button>
        </div>
        <label>Смена фона
          <select id="sBgInterval">
            <option value="0">При каждом открытии</option>
            <option value="1">Каждую минуту</option>
            <option value="5">Каждые 5 минут</option>
            <option value="15">Каждые 15 минут</option>
            <option value="30">Каждые 30 минут</option>
            <option value="1440">Раз в день</option>
          </select>
        </label>
      </div>

      <div id="bgCustomBox" hidden>
        <label>Свои URL (по одному на строку)
          <textarea id="sCustomUrls" rows="3" placeholder="https://..."></textarea>
        </label>
      </div>

      <div id="bgUploadBox" hidden>
        <label>Файл с компьютера
          <input type="file" id="sUpload" accept="image/*">
        </label>
        <div class="row">
          <button type="button" id="uploadClear" class="btn-ghost">Убрать файл</button>
        </div>
      </div>

      <div id="bgColorBox" hidden>
        <label>Цвет / градиент CSS
          <input id="sBgValue" placeholder="#14141c или linear-gradient(...)">
        </label>
        <div class="presets" id="bgPresets"></div>
      </div>

      <label>Блюр: <span id="blurVal"></span>
        <input type="range" id="sBlur" min="0" max="20" step="1">
      </label>
      <label>Затемнение: <span id="dimVal"></span>
        <input type="range" id="sDim" min="0" max="80" step="5">
      </label>

      </div>
      <div class="set-box">
      <h4>🎨 Оформление</h4>
      <label>Тема текста
        <select id="sTheme">
          <option value="dark">Белая (для фото)</option>
          <option value="light">Тёмная (для светлого)</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="sClock"> Показывать часы</label>

      </div>
      <div class="set-box">
      <h4>💾 Данные</h4>
      <div class="row">
        <button type="button" id="exportBtn" class="btn-ghost">⇩</button>
        <button type="button" id="importBtn" class="btn-ghost">⇧</button>
        <button type="button" id="resetBtn" class="btn-ghost">Сброс</button>
      </div>
      <input type="file" id="importFile" accept="application/json" hidden>
      </div>
    </div>
    <div class="drawer-foot">
      <button id="settingsSave" class="btn-primary">Готово</button>
    </div>
  </aside>
</div>

<!-- Контекстное меню (правая кнопка) -->
<div id="ctx" class="ctx" hidden></div>

<script src="app.js"></script>
</body>
</html>
