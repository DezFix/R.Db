<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R.Db</title>
<link rel="icon" type="image/png" href="icons/icon48.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="booting">
<div class="bg" id="bgA"></div>
<div class="bg" id="bgB"></div>
<div id="dim"></div>

<div class="page" id="page">
  <header class="top" id="top">
    <div class="clock-wrap" id="clockWrap">
      <div class="clock" id="clock"></div>
      <div class="hello" id="hello"></div>
    </div>
  </header>

  <div class="search" id="searchWrap">
    <span class="search-ic" id="searchIc"></span>
    <input id="search" type="text" autocomplete="off" spellcheck="false">
    <kbd class="search-kbd">/</kbd>
    <div class="results" id="results" hidden></div>
  </div>

  <nav class="boards" id="boards" hidden></nav>
  <main class="grid" id="grid"></main>

  <div class="empty-board" id="emptyBoard" hidden>
    <div class="empty-title" id="emptyTitle"></div>
    <div class="empty-hint" id="emptyHint"></div>
  </div>
</div>

<a class="credit" id="credit" target="_blank" rel="noopener" hidden></a>
<nav class="fab" id="fab">
  <button id="addBtn" class="fab-btn"></button>
  <button id="settingsBtn" class="fab-btn"></button>
</nav>

<div class="menu" id="menu" hidden></div>
<div class="toasts" id="toasts"></div>
<dialog id="dlg"></dialog>

<script src="icons-index.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
